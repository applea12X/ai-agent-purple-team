name: phase2
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  deterministic:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pythonhashseed: [0, 1, 2, 3, 5]
    env:
      PYTHONHASHSEED: ${{ matrix.pythonhashseed }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: make phase2-check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase2-deterministic-evidence-${{ matrix.pythonhashseed }}
          path: artifacts/
  container-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run playwright install --with-deps chromium
      - run: PURPLELOOP_CONTAINER_TESTS=1 uv run pytest tests/phase2/test_supportlab_isolation.py --no-cov
      - run: make supportlab-demo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase2-container-evidence
          path: artifacts/supportlab-demo/

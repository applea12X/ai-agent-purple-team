name: phase1
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  deterministic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: make phase1-check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase1-deterministic-evidence
          path: artifacts/
  isolated-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: PURPLELOOP_CONTAINER_TESTS=1 uv run pytest tests/phase1/test_isolation.py --no-cov
      - run: make phase1-demo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase1-container-evidence
          path: artifacts/phase1-demo/

name: phase0

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  safety-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: make phase0-check

  fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make fixture-up
      - run: make fixture-check
      - if: always()
        run: make fixture-down

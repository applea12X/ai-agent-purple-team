name: phase5
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # The Phase 5 nightly lane (loose ends 4.23-4.25). Offset from phase4.yml's 03:41 nightly.
    - cron: "17 4 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # §3 contracts — Manifest 1.5, RiskApproval, ShadowReport, EvaluationMatrix, AdjudicationRecord,
  # Scenario 1.4, and gate isolation for every new output type. Deterministic, no credentials.
  # The full suite (and its 85% branch-coverage floor) still runs in phase4.yml's pr-fast job;
  # this lane runs the Phase 5 tests alone, so it skips the whole-package coverage floor.
  # Later Phase 5 work packages append their own jobs below.
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: Assert the contracts lane holds no model credential
        run: |
          if [ -n "$PURPLELOOP_MODEL_API_KEY" ] || [ -n "$PURPLELOOP_MODEL_ENDPOINT" ]; then
            echo "::error::model credentials must never reach the contracts lane"
            exit 1
          fi
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest tests/phase5 --no-cov --junitxml=artifacts/junit-phase5.xml
      - run: uv run purpleloop phase5-contracts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase5-contracts-evidence
          path: artifacts/

  # WP5.0.8 adjudication tooling and WP5.4 review UI: the CLI write path, the precision report's
  # refusals, the UI's inert rendering over every corpus payload, blinding, local-only binding,
  # and bundle bytes unchanged after a full adjudication session. Offline; no model, no labels
  # from a human (every record in these tests is constructed by the test).
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: Assert the review lane holds no model credential
        run: |
          if [ -n "$PURPLELOOP_MODEL_API_KEY" ] || [ -n "$PURPLELOOP_MODEL_ENDPOINT" ]; then
            echo "::error::model credentials must never reach the review lane"
            exit 1
          fi
      - run: >-
          uv run pytest tests/phase5/test_review_adjudication.py tests/phase5/test_review_ui.py
          -s --cov-reset --cov=purpleloop.review --cov-branch --cov-report=term --cov-fail-under=85
          --junitxml=artifacts/junit-review.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase5-review-evidence
          path: artifacts/

  # WP5.6 — the AgentDojo-style benchmark subset. Checks the committed scenarios are exactly what
  # their hand-authored promotion records produce, then runs the subset offline under the scripted
  # and delimitation-blind stand-ins and keeps the metrics as evidence. Reported apart from the
  # authored 48; no model credential, no network. The tests also run in the contracts job above.
  benchmark-subset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: Assert the benchmark lane holds no model credential
        run: |
          if [ -n "$PURPLELOOP_MODEL_API_KEY" ] || [ -n "$PURPLELOOP_MODEL_ENDPOINT" ]; then
            echo "::error::model credentials must never reach the benchmark lane"
            exit 1
          fi
      - run: uv run purpleloop benchmark-promote
      - run: uv run purpleloop benchmark-run --output-dir artifacts/benchmark
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase5-benchmark-subset
          path: artifacts/benchmark/metrics-*.json

  # Loose ends 4.23-4.25 — the nightly lane. Its scenario subset and repetition count are read
  # from the signed nightly manifest (scenarios/nightly/, Manifest 1.4 nightly_scope), never from
  # this file: changing the nightly is a re-signed manifest. It runs the shared API/browser
  # workflow on real Chromium every night, and the agent scenarios against the configured
  # endpoint; with no endpoint those are a recorded skip-no-credential. Any other non-pass
  # outcome files or updates one tracking issue. Only this job may write issues.
  nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      issues: write
    env:
      PURPLELOOP_MODEL_API_KEY: ${{ secrets.PURPLELOOP_MODEL_API_KEY }}
      PURPLELOOP_MODEL_ENDPOINT: ${{ vars.PURPLELOOP_MODEL_ENDPOINT }}
      PURPLELOOP_MODEL_ID: ${{ vars.PURPLELOOP_MODEL_ID }}
      PURPLELOOP_MODEL_PROFILE: ${{ vars.PURPLELOOP_MODEL_PROFILE }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.12
      - run: uv sync --frozen
      # Pinned runner: Playwright 1.58.0 has no Chromium build for ubuntu-latest (26.04).
      - run: uv run playwright install --with-deps chromium
      - name: Verify the signed nightly scope
        id: scope
        run: uv run purpleloop nightly-scope --github-output "$GITHUB_OUTPUT"
      - name: Nightly lane (signed scope; browser workflow and agent scenarios)
        run: uv run purpleloop nightly-lane --output-dir artifacts/nightly
      - name: Classified outcomes
        if: ${{ !cancelled() }}
        run: cat artifacts/nightly/nightly.json || echo "no classified outcome was recorded"
      - name: File or update the tracking issue on a non-pass night
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          uv run purpleloop nightly-issue --output-dir artifacts/nightly \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase5-nightly-evidence
          path: artifacts/

  # WP5.1 — shadow mode and risk approval. The governance tests (capability delta, admission,
  # shadow mode with its zero-dispatch measurement over every corpus, the model-driven attacker
  # on a scripted model, the CLI sequence), then the CLI sequence itself with an approver key
  # generated for this job and discarded with the runner. No model, no credential.
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: Assert the governance lane holds no model credential
        run: |
          if [ -n "$PURPLELOOP_MODEL_API_KEY" ] || [ -n "$PURPLELOOP_MODEL_ENDPOINT" ]; then
            echo "::error::model credentials must never reach the governance lane"
            exit 1
          fi
      - run: >-
          uv run pytest --no-cov --junitxml=artifacts/junit-governance.xml
          tests/phase5/test_capability_delta.py tests/phase5/test_approval_admission.py
          tests/phase5/test_shadow_mode.py tests/phase5/test_model_driven_attacker.py
          tests/phase5/test_governance_cli.py tests/phase5/test_capability_baseline.py
          tests/phase5/test_risk_class_scenarios_removed.py
      - run: uv run purpleloop capability-baseline --check
      - name: Shadow, approve, and check a model-driven attacker (ephemeral approver key)
        run: |
          uv run purpleloop approver-keygen "$RUNNER_TEMP/approver.pem" "$RUNNER_TEMP/approver.pub.pem"
          uv run purpleloop shadow-run artifacts/governance/shadow --proposal-source model-driven
          uv run purpleloop approve artifacts/governance/shadow \
            --approver-key "$RUNNER_TEMP/approver.pem" --approver-key-id approver-ci-ephemeral \
            --approver "the CI runner, holding a key generated for this job" \
            --rationale "CI proof of the approval path" --ttl-hours 1 \
            --out artifacts/governance/approval.json
          uv run purpleloop approval-check artifacts/governance/shadow \
            --approval artifacts/governance/approval.json \
            --approver-public-key "$RUNNER_TEMP/approver.pub.pem" \
            --approver-key-id approver-ci-ephemeral
          if uv run purpleloop approval-check artifacts/governance/shadow; then
            echo "::error::an unapproved capability increase was admitted"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase5-governance-evidence
          path: artifacts/

  # WP5.2 evaluation matrix — offline stand-in subset only. Signs a three-scenario draft with a
  # key generated for the job, runs it (three deterministic stand-ins, no model endpoint), and
  # re-verifies the result. Real-pin rows never run on a PR or a push: they need a GPU, a signed
  # spend authorization, and an endpoint, none of which this job has.
  matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: Assert the matrix lane holds no model credential or endpoint
        run: |
          if [ -n "$PURPLELOOP_MODEL_API_KEY" ] || [ -n "$PURPLELOOP_MODEL_ENDPOINT" ]; then
            echo "::error::model credentials must never reach the matrix lane"
            exit 1
          fi
      - run: uv run pytest tests/phase5/test_evaluation_matrix.py --no-cov
      - name: Sign and run the offline stand-in subset
        run: |
          uv run purpleloop matrix-sign scenarios/matrix/standins-ci-subset.draft.json \
            --out artifacts/matrix-ci/spec.json --generate-key "$RUNNER_TEMP/matrix-key.pem"
          uv run purpleloop matrix-run artifacts/matrix-ci/spec.json --output-dir artifacts/matrix-ci
          uv run purpleloop matrix-report "$(ls -d artifacts/matrix-ci/*/ | tail -1)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase5-matrix-evidence
          path: artifacts/matrix-ci/

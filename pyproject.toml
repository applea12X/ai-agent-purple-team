[project]
name = "purpleloop"
version = "0.1.0"
description = "A local-first safety kernel for autonomous purple-team evaluations"
readme = "README.md"
authors = [
    { name = "applea12X", email = "abhi.pasam@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cryptography>=49.0.0",
    "fastapi>=0.115",
    "httpx>=0.28",
    "inspect-ai==0.3.263",
    "playwright==1.58.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2",
    "pyyaml>=6.0.3",
    "rfc8785>=0.1.4",
    "typer>=0.27.0",
    "uvicorn>=0.30",
]

[project.scripts]
purpleloop = "purpleloop.cli:app"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.161.5",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
    "types-pyyaml>=6.0.12.20260724",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["purpleloop"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --cov=purpleloop --cov-report=term-missing --cov-fail-under=85"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[project.entry-points.inspect_ai]
purpleloop = "purpleloop.adapters.inspect_model"
